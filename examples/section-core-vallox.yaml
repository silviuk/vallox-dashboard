# Explicit section generated by vallox-dashboard 1.0.0 for Home Assistant core "vallox" integration (example entity ids).
# Paste it into a sections view (Edit dashboard > Raw configuration editor > under 'sections:')
# and adjust the entity ids to your own. Only built-in cards are used.
- type: grid
  cards:
  - type: heading
    heading: Ventilation
    heading_style: title
    icon: mdi:hvac
    badges:
    - type: entity
      entity: sensor.vallox_outdoor_air
      show_state: true
      show_icon: true
  - type: tile
    entity: fan.vallox
    grid_options:
      columns: 12
    icon: mdi:fan
    color: blue
    state_content:
    - preset_mode
    - percentage
    features:
    - type: fan-preset-modes
      style: icons
      preset_modes:
      - Home
      - Away
      - Boost
      - Fireplace
      - Extra
      - Auto
    - type: fan-speed
    name: Ventilation
  - type: tile
    entity: sensor.vallox_current_profile
    grid_options:
      columns: 6
    icon: mdi:tune-vertical
    color: amber
    name: Profile
  - type: tile
    entity: sensor.vallox_fan_speed
    grid_options:
      columns: 6
    icon: mdi:speedometer
    name: Fan speed
  - type: heading
    heading: Air temperatures
    heading_style: subtitle
    icon: mdi:thermometer
  - type: tile
    entity: sensor.vallox_outdoor_air
    grid_options:
      columns: 6
    icon: mdi:home-import-outline
    color: teal
    name: Outdoor air
  - type: tile
    entity: sensor.vallox_supply_air
    grid_options:
      columns: 6
    icon: mdi:arrow-right-bold-box-outline
    color: green
    name: Supply air
  - type: tile
    entity: sensor.vallox_extract_air
    grid_options:
      columns: 6
    icon: mdi:home-thermometer-outline
    color: orange
    name: Extract air
  - type: tile
    entity: sensor.vallox_exhaust_air
    grid_options:
      columns: 6
    icon: mdi:home-export-outline
    color: brown
    name: Exhaust air
  - type: tile
    entity: sensor.vallox_supply_cell_air
    grid_options:
      columns: 6
    icon: mdi:swap-horizontal
    name: Supply air (after cell)
  - type: tile
    entity: sensor.vallox_efficiency
    grid_options:
      columns: 12
    icon: mdi:heat-wave
    color: green
    name: Heat recovery
  - type: heading
    heading: Indoor air
    heading_style: subtitle
    icon: mdi:air-filter
  - type: tile
    entity: sensor.vallox_humidity
    grid_options:
      columns: 6
    icon: mdi:water-percent
    color: blue
    name: Humidity
  - type: tile
    entity: sensor.vallox_co2
    grid_options:
      columns: 6
    icon: mdi:molecule-co2
    color: light-green
    name: CO₂
  - type: heading
    heading: Supply air targets
    heading_style: subtitle
    icon: mdi:thermometer-lines
  - type: tile
    entity: number.vallox_supply_air_temperature_home
    grid_options:
      columns: 4
    features:
    - type: numeric-input
      style: buttons
    name: Home
  - type: tile
    entity: number.vallox_supply_air_temperature_away
    grid_options:
      columns: 4
    features:
    - type: numeric-input
      style: buttons
    name: Away
  - type: tile
    entity: number.vallox_supply_air_temperature_boost
    grid_options:
      columns: 4
    features:
    - type: numeric-input
      style: buttons
    name: Boost
  - type: heading
    heading: Status
    heading_style: subtitle
    icon: mdi:list-status
  - type: tile
    entity: binary_sensor.vallox_post_heater
    grid_options:
      columns: 6
    icon: mdi:radiator
    color: red
    name: Post-heating
  - type: tile
    entity: sensor.vallox_cell_state
    grid_options:
      columns: 6
    icon: mdi:swap-horizontal-variant
    name: Cell state
  - type: tile
    entity: switch.vallox_bypass_locked
    grid_options:
      columns: 6
    icon: mdi:lock-outline
    name: Bypass locked
  - type: heading
    heading: Filter & service
    heading_style: subtitle
    icon: mdi:wrench-clock
  - type: tile
    entity: sensor.vallox_remaining_time_for_filter
    grid_options:
      columns: 6
    icon: mdi:air-filter
    name: Filter change due
  - type: tile
    entity: date.vallox_filter_change_date
    grid_options:
      columns: 6
    icon: mdi:calendar-check
    name: Filter changed on
  - type: history-graph
    title: Air temperatures (48 h)
    hours_to_show: 48
    entities:
    - entity: sensor.vallox_outdoor_air
      name: Outdoor air
    - entity: sensor.vallox_supply_air
      name: Supply air
    - entity: sensor.vallox_extract_air
      name: Extract air
    - entity: sensor.vallox_exhaust_air
      name: Exhaust air
  - type: history-graph
    title: Indoor air (24 h)
    hours_to_show: 24
    entities:
    - entity: sensor.vallox_humidity
      name: Humidity
  - type: history-graph
    title: CO₂
    hours_to_show: 24
    entities:
    - entity: sensor.vallox_co2
      name: CO₂
  - type: history-graph
    title: Activity (24 h)
    hours_to_show: 24
    entities:
    - entity: fan.vallox
      name: Fan
    - entity: sensor.vallox_current_profile
      name: Profile
    - entity: binary_sensor.vallox_post_heater
      name: Post-heating

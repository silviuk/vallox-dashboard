# Explicit section generated by vallox-dashboard 1.2.3 for vallox2mqtt (Vallox Digit SE / ValloPlus SE over RS485).
# Paste it into a sections view (Edit dashboard > Raw configuration editor > under 'sections:')
# and adjust the entity ids to your own. Only built-in cards are used.
- type: "grid"
  cards:
    - type: "heading"
      heading: "Ventilation"
      heading_style: "title"
      icon: "mdi:hvac"
      badges:
        - type: "entity"
          entity: "binary_sensor.ventilation"
          show_state: false
          show_icon: true
        - type: "entity"
          entity: "sensor.ventilation_outside_temperature"
          show_state: true
          show_icon: true
        - type: "entity"
          entity: "binary_sensor.ventilation_service_needed"
          show_state: true
          show_icon: true
          color: "red"
          visibility:
            - condition: "state"
              entity: "binary_sensor.ventilation_service_needed"
              state: "on"
    - type: "markdown"
      text_only: true
      visibility:
        - condition: "state"
          entity: "binary_sensor.ventilation_service_needed"
          state: "on"
      content: "<ha-alert alert-type=\"warning\">The unit reports that service (filter change) is due.</ha-alert>"
    - type: "markdown"
      text_only: true
      grid_options:
        columns: 12
      visibility:
        - condition: "or"
          conditions:
            - condition: "state"
              entity: "binary_sensor.ventilation_filter_warning"
              state: "on"
            - condition: "state"
              entity: "binary_sensor.ventilation_error_relay"
              state: "on"
            - condition: "state"
              entity: "binary_sensor.ventilation_cell_freeze_alarm"
              state: "on"
            - condition: "numeric_state"
              entity: "sensor.ventilation_fault_code"
              above: 0
      content: "<ha-alert alert-type=\"error\">The unit reports an alarm. Check the alarm tiles below.</ha-alert>"
    - type: "tile"
      entity: "climate.ventilation"
      grid_options:
        columns: 12
      icon: "mdi:fan"
      color: "blue"
      state_content:
        - "fan_mode"
        - "hvac_action"
      features:
        - type: "climate-fan-modes"
          style: "dropdown"
          fan_modes:
            - "1"
            - "2"
            - "3"
            - "4"
            - "5"
            - "6"
            - "7"
            - "8"
        - type: "climate-hvac-modes"
          hvac_modes:
            - "heat"
            - "fan_only"
      name: "Ventilation"
    - type: "tile"
      entity: "switch.ventilation_switch"
      grid_options:
        columns: 6
      icon: "mdi:rocket-launch"
      color: "amber"
      name: "Boost / fireplace"
    - type: "tile"
      entity: "sensor.ventilation_boost_remaining"
      grid_options:
        columns: 6
      icon: "mdi:timer-sand"
      name: "Built-in boost time left"
    - type: "tile"
      entity: "sensor.ventilation_switch_type"
      grid_options:
        columns: 6
      icon: "mdi:gesture-tap-button"
      name: "Switch function"
    - type: "markdown"
      grid_options:
        columns: 12
      content: "### Temperature flow\n**Outdoor air** {{ states('sensor.ventilation_outside_temperature') }} {{ state_attr('sensor.ventilation_outside_temperature', 'unit_of_measurement') or '' }} → **Supply air** {{ states('sensor.ventilation_incoming_temperature') }} {{ state_attr('sensor.ventilation_incoming_temperature', 'unit_of_measurement') or '' }}\n\n{% set o = states('sensor.ventilation_outside_temperature') | float(none) %}\n{% set i = states('sensor.ventilation_inside_temperature') | float(none) %}\n{% set x = states('sensor.ventilation_exhaust_temperature') | float(none) %}\n{% if o is not none and i is not none and x is not none and (i - o) >= 4 %}\n{% set eff = ((i - x) / (i - o) * 100) | round(0) | int %}\n<ha-icon icon=\"mdi:heat-wave\"></ha-icon> **Heat recovery (estimate): {{ [0, [eff, 100] | min] | max }} %**\n<small>estimated from extract and exhaust air: (extract − exhaust) ÷ (extract − outdoor)</small>\n{% else %}\n<ha-icon icon=\"mdi:heat-wave\"></ha-icon> Heat recovery: not enough temperature difference for an estimate right now.\n{% endif %}\n\n**Extract air** {{ states('sensor.ventilation_inside_temperature') }} {{ state_attr('sensor.ventilation_inside_temperature', 'unit_of_measurement') or '' }} → **Exhaust air** {{ states('sensor.ventilation_exhaust_temperature') }} {{ state_attr('sensor.ventilation_exhaust_temperature', 'unit_of_measurement') or '' }}"
    - type: "heading"
      heading: "Shower boost"
      heading_style: "subtitle"
      icon: "mdi:shower-head"
    - type: "button"
      entity: "script.vallox_shower_boost"
      name: "15 min · Level 6"
      icon: "mdi:shower-head"
      show_state: false
      grid_options:
        columns: 6
      tap_action:
        action: "perform-action"
        perform_action: "script.vallox_shower_boost"
        data:
          level: 6
          minutes: 15
      hold_action:
        action: "none"
    - type: "button"
      entity: "script.vallox_shower_boost"
      name: "15 min · Level 7"
      icon: "mdi:shower-head"
      show_state: false
      grid_options:
        columns: 6
      tap_action:
        action: "perform-action"
        perform_action: "script.vallox_shower_boost"
        data:
          level: 7
          minutes: 15
      hold_action:
        action: "none"
    - type: "button"
      entity: "script.vallox_shower_boost"
      name: "30 min · Level 6"
      icon: "mdi:shower-head"
      show_state: false
      grid_options:
        columns: 6
      tap_action:
        action: "perform-action"
        perform_action: "script.vallox_shower_boost"
        data:
          level: 6
          minutes: 30
      hold_action:
        action: "none"
    - type: "button"
      entity: "script.vallox_shower_boost"
      name: "30 min · Level 7"
      icon: "mdi:shower-head"
      show_state: false
      grid_options:
        columns: 6
      tap_action:
        action: "perform-action"
        perform_action: "script.vallox_shower_boost"
        data:
          level: 7
          minutes: 30
      hold_action:
        action: "none"
    - type: "tile"
      entity: "timer.vallox_shower_boost"
      grid_options:
        columns: 6
      visibility:
        - condition: "state"
          entity: "input_boolean.vallox_shower_boost_active"
          state: "on"
      icon: "mdi:timer-sand"
      name: "Shower boost time left"
    - type: "button"
      entity: "script.vallox_shower_boost_cancel"
      name: "Cancel shower boost"
      icon: "mdi:cancel"
      grid_options:
        columns: 6
      visibility:
        - condition: "state"
          entity: "input_boolean.vallox_shower_boost_active"
          state: "on"
      tap_action:
        action: "perform-action"
        perform_action: "script.vallox_shower_boost_cancel"
      hold_action:
        action: "none"
    - type: "heading"
      heading: "Auto humidity boost"
      heading_style: "subtitle"
      icon: "mdi:water-percent"
    - type: "tile"
      entity: "input_boolean.vallox_auto_humidity_boost"
      grid_options:
        columns: 6
      name: "Enable humidity boost"
    - type: "tile"
      entity: "input_number.vallox_auto_humidity_threshold"
      grid_options:
        columns: 6
      features:
        - type: "numeric-input"
          style: "buttons"
      name: "Humidity threshold"
    - type: "tile"
      entity: "input_number.vallox_auto_humidity_rise"
      grid_options:
        columns: 6
      features:
        - type: "numeric-input"
          style: "buttons"
      name: "Humidity rise"
    - type: "tile"
      entity: "input_number.vallox_auto_humidity_boost_level"
      grid_options:
        columns: 6
      features:
        - type: "numeric-input"
          style: "buttons"
      name: "Humidity boost level"
    - type: "tile"
      entity: "input_number.vallox_auto_humidity_boost_minutes"
      grid_options:
        columns: 6
      features:
        - type: "numeric-input"
          style: "buttons"
      name: "Humidity boost duration"
    - type: "tile"
      entity: "timer.vallox_auto_humidity_cooldown"
      grid_options:
        columns: 6
      icon: "mdi:timer-lock-outline"
      name: "Humidity boost cooldown"
    - type: "heading"
      heading: "Alarms"
      heading_style: "subtitle"
      icon: "mdi:alert"
    - type: "tile"
      entity: "binary_sensor.ventilation_filter_warning"
      grid_options:
        columns: 6
      icon: "mdi:alert-circle-outline"
      color: "red"
      name: "Filter warning"
    - type: "tile"
      entity: "binary_sensor.ventilation_error_relay"
      grid_options:
        columns: 6
      icon: "mdi:alert-circle-outline"
      color: "red"
      name: "Error relay"
    - type: "tile"
      entity: "binary_sensor.ventilation_cell_freeze_alarm"
      grid_options:
        columns: 6
      icon: "mdi:alert-circle-outline"
      color: "red"
      name: "Cell freeze alarm"
    - type: "tile"
      entity: "sensor.ventilation_fault_code"
      grid_options:
        columns: 6
      icon: "mdi:alert-circle-outline"
      color: "red"
      name: "Fault code"
    - type: "heading"
      heading: "Air temperatures"
      heading_style: "subtitle"
      icon: "mdi:thermometer"
    - type: "tile"
      entity: "sensor.ventilation_outside_temperature"
      grid_options:
        columns: 6
      icon: "mdi:home-import-outline"
      color: "teal"
      name: "Outdoor air"
    - type: "tile"
      entity: "sensor.ventilation_incoming_temperature"
      grid_options:
        columns: 6
      icon: "mdi:arrow-right-bold-box-outline"
      color: "green"
      name: "Supply air"
    - type: "tile"
      entity: "sensor.ventilation_inside_temperature"
      grid_options:
        columns: 6
      icon: "mdi:home-thermometer-outline"
      color: "orange"
      name: "Extract air"
    - type: "tile"
      entity: "sensor.ventilation_exhaust_temperature"
      grid_options:
        columns: 6
      icon: "mdi:home-export-outline"
      color: "brown"
      name: "Exhaust air"
    - type: "markdown"
      grid_options:
        columns: 12
      content: "{% set o = states('sensor.ventilation_outside_temperature') | float(none) %}\n{% set i = states('sensor.ventilation_inside_temperature') | float(none) %}\n{% set x = states('sensor.ventilation_exhaust_temperature') | float(none) %}\n{% if o is not none and i is not none and x is not none and (i - o) >= 4 %}\n{% set eff = ((i - x) / (i - o) * 100) | round(0) | int %}\n<ha-icon icon=\"mdi:heat-wave\"></ha-icon> **Heat recovery (estimate): {{ [0, [eff, 100] | min] | max }} %**\n<small>estimated from extract and exhaust air: (extract − exhaust) ÷ (extract − outdoor)</small>\n{% else %}\n<ha-icon icon=\"mdi:heat-wave\"></ha-icon> Heat recovery: not enough temperature difference for an estimate right now.\n{% endif %}"
    - type: "heading"
      heading: "Unit setpoints (read-only)"
      heading_style: "subtitle"
      icon: "mdi:thermometer-lines"
    - type: "tile"
      entity: "sensor.ventilation_bypass_setpoint"
      grid_options:
        columns: 6
      icon: "mdi:tune"
      tap_action:
        action: "more-info"
      name: "Bypass setpoint"
    - type: "tile"
      entity: "sensor.ventilation_preheat_setpoint"
      grid_options:
        columns: 6
      icon: "mdi:tune"
      tap_action:
        action: "more-info"
      name: "Preheat setpoint"
    - type: "tile"
      entity: "sensor.ventilation_defrost_setpoint"
      grid_options:
        columns: 6
      icon: "mdi:tune"
      tap_action:
        action: "more-info"
      name: "Defrost setpoint"
    - type: "tile"
      entity: "sensor.ventilation_defrost_hysteresis"
      grid_options:
        columns: 6
      icon: "mdi:tune"
      tap_action:
        action: "more-info"
      name: "Defrost hysteresis"
    - type: "tile"
      entity: "sensor.ventilation_post_heating_target"
      grid_options:
        columns: 6
      icon: "mdi:tune"
      tap_action:
        action: "more-info"
      name: "Post-heating target"
    - type: "tile"
      entity: "sensor.ventilation_maximum_fan_speed"
      grid_options:
        columns: 6
      icon: "mdi:tune"
      tap_action:
        action: "more-info"
      name: "Maximum fan level"
    - type: "heading"
      heading: "Status"
      heading_style: "subtitle"
      icon: "mdi:list-status"
    - type: "tile"
      entity: "binary_sensor.ventilation_motor_in"
      grid_options:
        columns: 6
      icon: "mdi:fan-chevron-down"
      color: "blue"
      name: "Supply fan"
    - type: "tile"
      entity: "binary_sensor.ventilation_motor_out"
      grid_options:
        columns: 6
      icon: "mdi:fan-chevron-up"
      color: "blue"
      name: "Extract fan"
    - type: "tile"
      entity: "binary_sensor.ventilation_front_heating"
      grid_options:
        columns: 6
      icon: "mdi:radiator"
      color: "red"
      name: "Pre-heating"
    - type: "tile"
      entity: "binary_sensor.ventilation_post_heating"
      grid_options:
        columns: 6
      icon: "mdi:radiator"
      color: "red"
      name: "Post-heating"
    - type: "tile"
      entity: "binary_sensor.ventilation_summer_mode"
      grid_options:
        columns: 6
      icon: "mdi:weather-sunny"
      color: "amber"
      name: "Summer mode"
    - type: "heading"
      heading: "Filter & service"
      heading_style: "subtitle"
      icon: "mdi:wrench-clock"
    - type: "tile"
      entity: "sensor.ventilation_service_counter"
      grid_options:
        columns: 6
      icon: "mdi:calendar-clock"
      name: "Service counter"
    - type: "tile"
      entity: "binary_sensor.ventilation_service_needed"
      grid_options:
        columns: 6
      icon: "mdi:wrench-clock"
      name: "Service needed"
    - type: "history-graph"
      title: "Air temperatures (48 h)"
      hours_to_show: 48
      entities:
        - entity: "sensor.ventilation_outside_temperature"
          name: "Outdoor air"
        - entity: "sensor.ventilation_incoming_temperature"
          name: "Supply air"
        - entity: "sensor.ventilation_inside_temperature"
          name: "Extract air"
        - entity: "sensor.ventilation_exhaust_temperature"
          name: "Exhaust air"
    - type: "history-graph"
      title: "Activity (24 h)"
      hours_to_show: 24
      entities:
        - entity: "switch.ventilation_switch"
          name: "Boost / fireplace"
        - entity: "binary_sensor.ventilation_motor_in"
          name: "Supply fan"
        - entity: "binary_sensor.ventilation_motor_out"
          name: "Extract fan"
        - entity: "binary_sensor.ventilation_front_heating"
          name: "Pre-heating"
        - entity: "binary_sensor.ventilation_post_heating"
          name: "Post-heating"
        - entity: "binary_sensor.ventilation_summer_mode"
          name: "Summer mode"

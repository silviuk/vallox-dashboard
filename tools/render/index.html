<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vallox graphic style · offline preview</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; width:536px; max-width:100%; padding:28px; background:#fafafa; color:#212121; font-family:Arial,sans-serif;
    --primary-font-family:Arial,sans-serif; --ha-card-background:#ffffff; --primary-text-color:#212121;
    --secondary-text-color:#727272; --divider-color:#e0e0e0; --secondary-background-color:#e5e5e5; --state-active-color:#d39222; }
  body.dark { background:#111111; color:#e1e1e1; --ha-card-background:#1c1c1c; --primary-text-color:#e1e1e1;
    --secondary-text-color:#9b9b9b; --divider-color:#3a3a3a; --secondary-background-color:#282828; --state-active-color:#f3b84d; }
  header { display:block; margin:0 6px 20px; }
  h1 { font-size:22px; margin:0; font-weight:500; } p { margin:10px 0 0; font-size:13px; opacity:.7; }
  main { display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); grid-auto-rows:auto; gap:8px; max-width:480px; margin:auto; }
  body.narrow { padding:12px; width:390px; max-width:100%; } body.narrow main { width:100%; max-width:366px; }
  body.narrow header { display:block; } body.narrow p { margin-top:10px; }
  @media(max-width:480px) { body { padding:12px; } }
  @media(max-width:720px) { header { display:block; } p { margin-top:10px; } }
  .mock { border:1px solid var(--divider-color); border-radius:12px; padding:14px; background:var(--ha-card-background); font-size:14px; }
  .heading { font-size:16px; margin:8px 0 4px; }
  #actions { font-size:12px; margin:16px 6px; }
</style>
<header><h1>Vallox · Graphic style</h1><p>Original MIT artwork · offline sample · 1.2.4</p></header>
<main id="cards"></main><div id="actions" role="status"></div>
<script src="sample-data.js"></script>
<script src="../../dist/vallox-dashboard.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  document.body.classList.toggle("dark", params.get("theme") === "dark");
  document.body.classList.toggle("narrow", ["phone", "narrow"].includes(params.get("layout")));
  const hass = window.valloxGraphicSample;
  hass.locale = { language: params.get("lang") || "en" };
  // Deliberately local: taps only record payloads; this harness has no HA connection.
  hass.callService = async (...args) => { document.querySelector("#actions").textContent = JSON.stringify(args); };
  if (params.get("variant") === "bypass") hass.states["binary_sensor.ventilation_summer_mode"].state = "on";
  if (params.get("variant") === "stopped") hass.states["binary_sensor.ventilation"].state = "off";
  // Render the strategy's own leading cards, through the next group heading.
  const configs = params.has("view") ? [{type:"custom:vallox-graphic-card",view:params.get("view"),grid_options:{columns:12,rows:"auto"}}]
    : window.valloxDashboard.buildSection(hass, {style:"graphic",section:"overview"}).cards;
  let graphics = 0;
  for (const config of configs) {
    const graphic = config.type === "custom:vallox-graphic-card";
    const card = document.createElement(graphic ? "vallox-graphic-card" : "div");
    if (graphic) { card.setConfig(config); card.hass = hass; graphics++; }
    else {
      if (config.type !== "heading" && config.type !== "tile") continue;
      card.className = config.type === "heading" ? "heading" : "mock";
      card.textContent = config.heading || config.name || config.entity;
      if (config.type === "tile") {
        const state = document.createElement("div");
        state.style.cssText = "margin-top:6px;color:var(--secondary-text-color);font-size:13px";
        state.textContent = hass.states[config.entity]?.state ?? "—";
        card.append(state);
      }
    }
    const grid = config.grid_options || (graphic ? card.getGridOptions() : {columns:12});
    card.style.gridColumn = "span " + (grid.columns === "full" ? 12 : grid.columns || 12);
    // HA sections use 56px rows with an 8px gap; automatic cards follow their content.
    if (Number.isFinite(grid.rows)) card.style.height = (grid.rows * 56 + (grid.rows - 1) * 8) + "px";
    document.querySelector("#cards").append(card);
    if (graphics === 2 && config.type === "heading") break;
  }
  setTimeout(() => {
    const cards = [...document.querySelectorAll('vallox-graphic-card')];
    const rects = cards.map(c => c.getBoundingClientRect());
    const next = cards.at(-1)?.nextElementSibling?.getBoundingClientRect();
    document.body.dataset.layoutCheck = JSON.stringify({width:document.body.offsetWidth, contentBottom:Math.ceil(document.querySelector('#cards').getBoundingClientRect().bottom + 16), widths:rects.map(r=>Math.round(r.width)), stacked:rects.length < 2 || rects[1].top >= rects[0].bottom, followingGap:next ? Math.round(next.top-rects.at(-1).bottom) : null});
  }, 50);
</script>
</html>

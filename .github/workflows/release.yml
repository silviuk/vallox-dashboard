name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release_asset:
    name: Attach vallox-dashboard.js
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          FILE_VERSION=$(grep -oP 'VALLOX_DASHBOARD_VERSION = "\K[^"]+' dist/vallox-dashboard.js)
          echo "tag=$TAG file=$FILE_VERSION"
          test "$TAG" = "$FILE_VERSION"
      - name: Upload asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" dist/vallox-dashboard.js --clobber
